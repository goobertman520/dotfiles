# =========================================
#  Backend & VSync
# =========================================
backend = "glx";
vsync = true;

# =========================================
#  Shadows
# =========================================
shadow = true;
shadow-radius = 16;
shadow-offset-x = -16;
shadow-offset-y = -16;
shadow-opacity = 0.75;
shadow-color = "#000000";

# Exclude shadows from panels, docks, and desktop widgets
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Plank'",
    "class_g = 'waybar'"
];

# =========================================
#  Fading (Smooth transitions)
# =========================================
fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-exclude = [];

# =========================================
#  Opacity & Transparency
# =========================================
active-opacity = 1.0;
inactive-opacity = 0.85;
frame-opacity = 1.0;
inactive-dim = 0.1; # Slightly dims inactive windows

# =========================================
#  Blur (Requires GLX backend)
# =========================================
blur-method = "dual_kawase";
blur-size = 12;
blur-deviation = 5.0;
blur-strength = 4;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;

# =========================================
#  Rounded Corners
# =========================================
corner-radius = 0;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# =========================================
#  Misc / Performance
# =========================================
# If you experience screen tearing or flickering with GLX, change this to false
use-damage = true; 

# Detect rounded corners from the application itself (like GNOME/GTK apps)
detect-rounded-corners = true;
detect-client-opacity = true;
