[main]
font=Maple Mono:size=12
pad=6x6

# foot.ini — monochrome grayscale theme matched to Waybar CSS
# Palette sourced from waybar style.css:
#   000000  window background
#   ffffff  text / focused / urgent / border
#   333333  visible workspace background
#   555555  hover background
#   888888  muted (mpris paused, pulseaudio muted)
#   bbbbbb  custom-kernel text

[colors-dark]
alpha=0.92
background=000000
foreground=ffffff

selection-background=333333
selection-foreground=ffffff

# Regular colors — mid grays, tonal emphasis only
regular0=333333
regular1=888888
regular2=888888
regular3=bbbbbb
regular4=888888
regular5=bbbbbb
regular6=bbbbbb
regular7=bbbbbb

# Bright colors — lighter grays / pure white for emphasis
bright0=555555
bright1=bbbbbb
bright2=bbbbbb
bright3=ffffff
bright4=bbbbbb
bright5=ffffff
bright6=ffffff
bright7=ffffff
